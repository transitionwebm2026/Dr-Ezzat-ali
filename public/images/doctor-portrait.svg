<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Doctor portrait placeholder">
  <!-- PLACEHOLDER — replace with the doctor's real photo (transparent PNG/WebP cut-out recommended).
       Update `doctorPortrait` in src/config/site.ts after adding the file. -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D5DEE8"/>
      <stop offset="1" stop-color="#A3B3C6"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EBF2"/>
    </linearGradient>
    <linearGradient id="coat-r" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE5EE"/>
    </linearGradient>
    <linearGradient id="lapel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF3F8"/>
      <stop offset="1" stop-color="#D3DEE9"/>
    </linearGradient>
    <linearGradient id="scrub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A5C9E"/>
      <stop offset="1" stop-color="#05355C"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4A5E"/>
      <stop offset="1" stop-color="#526379"/>
    </linearGradient>
  </defs>

  <!-- Neck -->
  <path d="M342 500h116v150c0 30-26 52-58 52s-58-22-58-52Z" fill="url(#skin)"/>
  <path d="M342 590c34 26 82 26 116 0v-50H342Z" fill="#64748B" opacity=".22"/>

  <!-- Ears -->
  <ellipse cx="276" cy="400" rx="20" ry="34" fill="url(#skin)"/>
  <ellipse cx="524" cy="400" rx="20" ry="34" fill="url(#skin)"/>

  <!-- Head -->
  <ellipse cx="400" cy="388" rx="124" ry="148" fill="url(#skin)"/>
  <!-- Hair -->
  <path d="M276 380c-10-112 52-182 124-182s134 70 124 182c-14-66-58-104-124-104s-110 38-124 104Z" fill="url(#hair)"/>

  <!-- Scrub top visible in the coat opening -->
  <path d="M296 646 400 822 504 646c-34-16-174-16-208 0Z" fill="url(#scrub)"/>
  <path d="M352 646 400 724 448 646c-18 9-78 9-96 0Z" fill="url(#skin)"/>

  <!-- Coat halves -->
  <path d="M52 1000c10-186 92-308 244-354l104 176v178Z" fill="url(#coat)"/>
  <path d="M748 1000c-10-186-92-308-244-354L400 822v178Z" fill="url(#coat-r)"/>

  <!-- Lapels -->
  <path d="M296 646 396 818l-46 34-86-150Z" fill="url(#lapel)"/>
  <path d="M504 646 404 818l46 34 86-150Z" fill="url(#lapel)"/>

  <!-- Placket & buttons -->
  <path d="M400 822v178" stroke="#CBD6E2" stroke-width="3"/>
  <circle cx="418" cy="884" r="7" fill="#CBD6E2"/>
  <circle cx="418" cy="954" r="7" fill="#CBD6E2"/>

  <!-- Chest pocket + pen -->
  <rect x="528" y="772" width="11" height="58" rx="5.5" fill="#269AC8"/>
  <rect x="524" y="768" width="19" height="12" rx="4" fill="#07508C"/>
  <path d="M500 826h124" stroke="#CBD6E2" stroke-width="3" stroke-linecap="round"/>

  <!-- Name badge -->
  <rect x="176" y="792" width="112" height="44" rx="10" fill="#FFFFFF" stroke="#DCE5EE" stroke-width="2"/>
  <rect x="190" y="804" width="56" height="7" rx="3.5" fill="#269AC8"/>
  <rect x="190" y="818" width="80" height="6" rx="3" fill="#CBD6E2"/>

  <!-- Stethoscope -->
  <path d="M336 652c-28 70-34 150-22 232" fill="none" stroke="#269AC8" stroke-width="11" stroke-linecap="round"/>
  <path d="M464 652c30 64 36 132 20 196" fill="none" stroke="#269AC8" stroke-width="11" stroke-linecap="round"/>
  <path d="M484 848c-6 26-18 40-34 46" fill="none" stroke="#1C7DA6" stroke-width="9" stroke-linecap="round"/>
  <circle cx="432" cy="902" r="26" fill="#E9EFF5" stroke="#07508C" stroke-width="8"/>
  <circle cx="432" cy="902" r="9" fill="#07508C"/>
  <circle cx="314" cy="890" r="10" fill="#07508C"/>
</svg>
